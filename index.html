<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Stock Game Simulation (FSGS)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600;700&display=swap');
    :root { font-size: 16px; }
    body { font-family: 'Sarabun', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Kanit', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between custom-scroll">

  <!-- ================= AUTH VIEW ================= -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-gradient-to-tr from-emerald-500 to-indigo-600 rounded-2xl shadow-lg">
          <i data-lucide="trending-up" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-wide">Family Stock Game Simulation</h1>
        <p class="text-sm text-slate-400">ระบบจำลองการลงทุนสำหรับครอบครัว (FSGS Cloud)</p>
      </div>

      <!-- Auth Switcher -->
      <div class="flex border-b border-slate-800 text-sm font-semibold">
        <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-2 border-b-2 border-emerald-500 text-emerald-400">เข้าสู่ระบบ</button>
        <button type="button" id="tab-register" onclick="switchAuthTab('register')" class="flex-1 pb-2 border-b-2 border-transparent text-slate-400 hover:text-white">ลงทะเบียนใหม่</button>
      </div>

      <div id="auth-alert" class="hidden p-3 rounded-xl text-xs font-semibold"></div>

      <!-- Form Inputs -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">ชื่อผู้ใช้งาน (Username)</label>
          <input type="text" id="auth-username" autocomplete="off" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div id="register-extra-fields" class="hidden space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">ชื่อ-นามสกุลจริง</label>
            <input type="text" id="auth-fullname" placeholder="เช่น สมชาย ใจดี" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">เบอร์โทรศัพท์</label>
            <input type="tel" id="auth-phone" placeholder="เช่น 0812345678" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">อีเมล (Email)</label>
            <input type="email" id="auth-email" placeholder="เช่น example@email.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่าน (Password)</label>
          <input type="password" id="auth-password" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-emerald-500" />
        </div>

        <button type="button" id="auth-btn" onclick="handleAuthSubmit()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition text-base">
          <span id="auth-btn-label">เข้าสู่ระบบ</span>
        </button>
      </div>

      <!-- Gmail Quick Login Button -->
      <div class="pt-4 border-t border-slate-800">
        <button type="button" onclick="loginWithGmailPrompt()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-bold py-3 rounded-xl flex items-center justify-center gap-3 shadow transition text-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/></svg>
          <span>เข้าสู่ระบบด่วนด้วย Gmail</span>
        </button>
      </div>

      <div class="text-xs text-slate-500 text-center pt-2">
        <span>สมาชิกใหม่รับทุนจำลองเริ่มต้น ฿30,000</span>
      </div>
    </div>
  </div>

  <!-- ================= MAIN APP VIEW ================= -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-30 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center font-bold text-white text-lg">FSGS</div>
        <div>
          <h1 class="font-bold text-base leading-tight">Family Stock Game Simulation</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span id="role-badge" class="text-xs px-2 py-0.2 rounded bg-slate-800 text-slate-400">สมาชิกทั่วไป</span>
            <span id="cloud-sync-status" class="text-[10px] text-emerald-400 flex items-center gap-1 font-mono">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Cloud ซิงค์อยู่
            </span>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-3 flex-wrap">
        <!-- Live Countdown & Status Box -->
        <div class="flex items-center bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/60 gap-2.5">
          <div class="flex items-center gap-1.5">
            <span id="status-led" class="w-3 h-3 rounded-full bg-rose-500 inline-block shadow-sm"></span>
            <span id="status-text" class="text-[11px] font-bold text-slate-300">หยุดจำลอง</span>
          </div>
          <div class="h-4 w-px bg-slate-
