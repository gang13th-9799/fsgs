<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - เกมจำลองการเงิน</title>
  <!-- ใช้งาน Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    body {
      font-family: 'Kanit', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden">

  <!-- พื้นหลังตกแต่งด้วยแสงนีออน แดง-ฟ้า -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- หัวข้อด้านบน -->
  <header class="w-full pt-10 text-center z-10">
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider text-white">
      FINANCIAL <span class="text-red-500">SIMULATOR</span> <span class="text-sky-400">GAME</span>
    </h1>
    <p class="text-neutral-400 text-sm mt-1">เกมจำลองการเงินและการลงทุน</p>
  </header>

  <!-- กล่องเข้าสู่ระบบหลัก (Main Login Box) -->
  <main class="w-full max-w-md px-6 py-6 z-10">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md">
      
      <!-- ปุ่ม Sign in with Google -->
      <button onclick="handleGoogleLogin()" 
              class="w-full flex items-center justify-center gap-3 bg-white text-black font-semibold py-3 px-4 rounded-xl hover:bg-neutral-200 transition-all duration-200 shadow-md">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

      <!-- เส้นคั่นแบ่ง -->
      <div class="relative my-6 text-center">
        <hr class="border-neutral-800">
        <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-neutral-900 px-3 text-xs text-neutral-400">
          หรือเข้าเล่นแบบ Guest
        </span>
      </div>

      <!-- ฟอร์ม Guest Login -->
      <form id="guestForm" onsubmit="handleGuestLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">ชื่อผู้เล่น <span class="text-red-500">*</span></label>
          <input type="text" id="guestName" required placeholder="ใส่ชื่อของคุณ" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400 transition-colors">
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">เบอร์โทรศัพท์</label>
          <input type="tel" id="guestPhone" placeholder="08X-XXX-XXXX" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400 transition-colors">
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">อีเมล</label>
          <input type="email" id="guestEmail" placeholder="example@email.com" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400 transition-colors">
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-300 mb-1">เลือกอาชีพในเกม</label>
          <select id="guestCareer" 
                  class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400 transition-colors">
            <option value="พนักงานบริษัท">พนักงานบริษัท (Salaryman)</option>
            <option value="ฟรีแลนซ์">ฟรีแลนซ์ (Freelancer)</option>
            <option value="วิศวกร">วิศวกร (Engineer)</option>
            <option value="แพทย์">แพทย์ (Doctor)</option>
            <option value="เจ้าของร้านกาแฟ">เจ้าของร้านกาแฟ (Cafe Owner)</option>
          </select>
        </div>

        <button type="submit" 
                class="w-full mt-2 bg-sky-500 hover:bg-sky-400 text-black font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-sky-500/20">
          เข้าสู่ห้องรอเล่นเกม
        </button>
      </form>
    </div>
  </main>

  <!-- แถบด้านล่าง (Footer Bar) พร้อมปุ่ม Admin Emoji 🥸 -->
  <footer class="w-full py-4 border-t border-neutral-900 bg-neutral-950/80 backdrop-blur-sm flex justify-between items-center px-8 z-10">
    <div class="text-xs text-neutral-500">
      รองรับผู้เล่นสูงสุด 20 คนต่อรอบ
    </div>
    
    <!-- ปุ่ม Admin รูปคนใส่แว่น 🥸 -->
    <div>
      <button onclick="openAdminModal()" 
              title="เข้าสู่ระบบผู้ดูแลระบบ (Admin)" 
              class="w-10 h-10 flex items-center justify-center text-2xl rounded-full bg-neutral-900 border border-neutral-800 hover:border-red-500 hover:scale-110 transition-all duration-200 shadow-md">
        🥸
      </button>
    </div>
  </footer>

  <!-- Modal สำหรับ Admin Login -->
  <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-neutral-900 border border-red-500/50 rounded-2xl w-full max-w-sm p-6 relative shadow-2xl">
      <!-- ปุ่มปิด -->
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white">✕</button>

      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🥸</div>
        <h3 class="text-lg font-bold text-red-500">เข้าสู่ระบบผู้ดูแลระบบ</h3>
        <p class="text-xs text-neutral-400">เฉพาะ Admin ที่มีสิทธิ์ควบคุมห้องเกม</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-neutral-300 mb-1">รหัสผ่าน Admin</label>
          <input type="password" id="adminPassword" required placeholder="ใส่รหัสผ่าน" 
                 class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
        </div>
        <button type="submit" 
                class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 rounded-lg transition-colors">
          ยืนยันสิทธิ์ Admin
        </button>
      </form>
    </div>
  </div>

  <!-- Script จัดการข้อมูลและการเปลี่ยนหน้า -->
  <script>
    // 1. จำลองการล็อกอินด้วย Google
    function handleGoogleLogin() {
      // ตัวอย่างข้อมูลจำลองเมื่อต่อกับ Firebase / Google Auth
      const userData = {
        name: "Google Player",
        email: "player@gmail.com",
        phone: "-",
        career: "พนักงานบริษัท",
        role: "player",
        loginType: "google"
      };
      saveAndRedirect(userData);
    }

    // 2. ล็อกอินแบบ Guest
    function handleGuestLogin(e) {
      e.preventDefault();
      const userData = {
        name: document.getElementById('guestName').value,
        phone: document.getElementById('guestPhone').value || "-",
        email: document.getElementById('guestEmail').value || "-",
        career: document.getElementById('guestCareer').value,
        role: "player",
        loginType: "guest"
      };
      saveAndRedirect(userData);
    }

    // 3. Modal Admin
    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
    }
    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    // 4. ล็อกอิน Admin
    function handleAdminLogin(e) {
      e.preventDefault();
      const password = document.getElementById('adminPassword').value;
      
      // ตัวอย่างรหัสผ่านจำลอง (ควรตรวจสอบผ่าน Server/Firebase ในงานจริง)
      if (password === "admin1234") {
        const adminData = {
          name: "Game Master (Admin)",
          email: "admin@system.local",
          phone: "-",
          career: "ผู้ดูแลระบบ",
          role: "admin",
          loginType: "admin"
        };
        saveAndRedirect(adminData);
      } else {
        alert("รหัสผ่าน Admin ไม่ถูกต้อง!");
      }
    }

    // บันทึก Session และนำทางไปยังหน้าห้องรอ (Lobby)
    function saveAndRedirect(user) {
      localStorage.setItem('currentUser', JSON.stringify(user));
      alert(`เข้าสู่ระบบสำเร็จในฐานะ: ${user.name} (${user.role.toUpperCase()})`);
      // เมื่อทำหน้า lobby เสร็จ สามารถเปิดใช้บรรทัดนี้:
      // window.location.href = 'lobby.html';
    }
  </script>
</body>
</html>
